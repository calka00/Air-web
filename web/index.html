<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0d12">
    <title>CalkaAIR Sterowanie</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <main class="app">
      <header><div><p class="eyebrow">CALKA AIR</p><h1>Sterowanie</h1></div><button id="connect-button">Połącz</button></header>
      <p id="connection-status" role="status">Otwórz stronę w Bluefy, aby użyć Bluetooth.</p>
      <section class="pressure-grid" aria-label="Aktualne ciśnienia">
        <article class="pressure-card"><span>Prawy przód</span><strong data-pressure="frontRight">--</strong><small>PSI</small></article>
        <article class="pressure-card"><span>Lewy przód</span><strong data-pressure="frontLeft">--</strong><small>PSI</small></article>
        <article class="pressure-card"><span>Prawy tył</span><strong data-pressure="rearRight">--</strong><small>PSI</small></article>
        <article class="pressure-card"><span>Lewy tył</span><strong data-pressure="rearLeft">--</strong><small>PSI</small></article>
        <article class="pressure-card tank"><span>Tank</span><strong data-pressure="tank">--</strong><small>PSI</small></article>
      </section>
      <section class="compressor-panel" aria-label="Sterowanie kompresorem"><div><h2>Kompresor</h2><p id="compressor-status">Stan: --</p></div><button id="compressor-button" disabled>Włącz kompresor</button></section>
      <section><div class="section-title"><h2>Sterowanie kołami</h2><span>Przytrzymaj, aby otworzyć</span></div><div id="wheel-controls" class="wheel-grid"></div></section>
      <section><div class="section-title"><h2>Presety</h2><span id="preset-values">Wybierz preset</span></div><div class="preset-grid">
        <button data-preset="0">1</button><button data-preset="1">2</button><button data-preset="2">3</button><button data-preset="3">4</button><button data-preset="4">5</button>
      </div><button id="save-preset" class="save" disabled>Zapisz bieżące ciśnienia</button></section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
